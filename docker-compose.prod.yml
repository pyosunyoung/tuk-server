# 운영용 스택 (앱 + PostgreSQL + Redis). VM 한 대에 통째로 올리는 구성.
#
# 배포는 GitHub Actions 가 한다(.github/workflows/backend.yml):
#   main push → 테스트 → 이미지 빌드·GHCR push → 서버의 ops/deploy/tuk-deploy 가 이 파일로 교체.
# 서버에서 빌드하지 않는다(2GB VM 에서 Gradle 빌드가 돌아가는 앱과 메모리를 다툼).
#
# 현재 배포된 태그는 배포 스크립트가 .env 의 TUK_IMAGE_TAG 에 기록한다 → 서버에서 평소 명령은 그대로:
#   docker compose -f docker-compose.prod.yml logs -f app
#
# 로컬 개발은 docker-compose.yml(인프라만) 을 쓴다 — 이 파일과 섞지 말 것.

services:
  app:
    # 태그 = 커밋 SHA. 롤백은 이전 SHA 로 다시 띄우면 된다.
    image: "ghcr.io/pyosunyoung/tuk-server:${TUK_IMAGE_TAG:?배포할 이미지 태그(커밋 SHA)가 필요합니다}"
    container_name: tuk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tuk}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호를 .env 에 넣어주세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT 시크릿(32바이트 이상)을 .env 에 넣어주세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # FCM: 키 파일은 이미지에 굽지 않고 아래 볼륨으로 넣는다
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      # 왼쪽 경로에 서비스 계정 키를 두면 컨테이너 안에서 읽는다(읽기 전용)
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    # 외부 노출은 Caddy 가 맡는다. 앱은 내부 네트워크에서만 접근된다.
    expose:
      - "8080"
    # 2GB VM 기준 상한. JVM 은 MaxRAMPercentage=75 라 이 값의 75%(=768MB)를 힙으로 쓴다.
    # 상한이 없으면 JVM 이 호스트 전체 메모리의 75% 를 잡으려 해 DB·Redis 와 충돌한다.
    mem_limit: 1g

  # HTTPS 종단 + 리버스 프록시. 도메인만 있으면 인증서를 알아서 발급·갱신한다.
  caddy:
    image: caddy:2
    container_name: tuk-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # 값 안에 ': ' 가 들어가면 YAML 매핑으로 파싱되므로 따옴표 필수
      TUK_DOMAIN: "${TUK_DOMAIN:?도메인을 .env 에 넣어주세요 (예: tuk.example.com)}"
    ports:
      - "80:80"     # Let's Encrypt 인증(HTTP-01)에 필요. HTTPS 로 자동 리다이렉트된다
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 발급받은 인증서 — 지우면 재발급(Let's Encrypt 한도 주의)
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    mem_limit: 96m

  postgres:
    image: postgres:16
    container_name: tuk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호를 .env 에 넣어주세요}
      POSTGRES_DB: ${POSTGRES_DB:-tuk}
      TZ: Asia/Seoul
    volumes:
      - tuk-postgres-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tuk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 외부에 포트를 열지 않는다 — 앱만 내부 네트워크로 접근한다
    expose:
      - "5432"

  redis:
    image: redis:7
    container_name: tuk-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    # refresh 토큰이 여기 있다 → 재시작해도 살아남게 AOF 켠다(끄면 전원 재로그인)
    # maxmemory: 상한에 닿으면 오래된 키부터 버린다(무한 증가로 VM 을 잡아먹지 않게).
    # presence 는 어차피 TTL 로 사라지고, refresh 토큰은 크기가 작다.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - tuk-redis-data:/data
    mem_limit: 192m
    expose:
      - "6379"

volumes:
  tuk-postgres-data:
  tuk-redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
