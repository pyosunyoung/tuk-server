# 운영용 스택 (앱 + PostgreSQL + Redis). VM 한 대에 통째로 올리는 구성.
#
#   cp .env.example .env      # 실제 값 채우기 (이 파일은 커밋되지 않는다)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app
#
# 로컬 개발은 docker-compose.yml(인프라만) 을 쓴다 — 이 파일과 섞지 말 것.

services:
  app:
    build: .
    container_name: tuk-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tuk}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호를 .env 에 넣어주세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT 시크릿(32바이트 이상)을 .env 에 넣어주세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # FCM: 키 파일은 이미지에 굽지 않고 아래 볼륨으로 넣는다
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      # 왼쪽 경로에 서비스 계정 키를 두면 컨테이너 안에서 읽는다(읽기 전용)
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: tuk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호를 .env 에 넣어주세요}
      POSTGRES_DB: ${POSTGRES_DB:-tuk}
      TZ: Asia/Seoul
    volumes:
      - tuk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tuk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 외부에 포트를 열지 않는다 — 앱만 내부 네트워크로 접근한다
    expose:
      - "5432"

  redis:
    image: redis:7
    container_name: tuk-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    # refresh 토큰이 여기 있다 → 재시작해도 살아남게 AOF 켠다(끄면 전원 재로그인)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tuk-redis-data:/data
    expose:
      - "6379"

volumes:
  tuk-postgres-data:
  tuk-redis-data:
