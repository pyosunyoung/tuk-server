# 툭 서버 SSH 강화 (2026-09-17)
# sshd 는 같은 설정이 여러 번 나오면 "먼저 읽은 값"을 쓴다.
# 50-cloud-init.conf 의 PasswordAuthentication yes 보다 먼저 읽히도록 00- 으로 시작한다.

# 비밀번호 로그인 전면 금지 — 키로만 들어온다 (무차별 대입 원천 차단)
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# root 는 키로만 허용 (비밀번호로는 불가)
PermitRootLogin prohibit-password

# 한 연결에서 시도할 수 있는 인증 횟수 축소
MaxAuthTries 3
