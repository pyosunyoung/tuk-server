# 운영 프로필. SPRING_PROFILES_ACTIVE=prod 로 켠다.
# 여기 값들은 "운영에서 켜지면 안 되는 것"을 끄는 안전장치다 — 실제 비밀값은 환경변수로 주입한다.
# (DB_URL·DB_USERNAME·DB_PASSWORD·REDIS_HOST·JWT_SECRET·CORS_ALLOWED_ORIGINS)

spring:
  jpa:
    # 운영에서 SQL 을 통째로 찍으면 로그가 폭발하고 개인정보가 남는다.
    show-sql: false
  flyway:
    # 운영 DB 는 처음부터 V1 로 만든다. baseline 은 "이미 테이블이 있는 개발 DB" 용 편의라 끈다 —
    # 켜둔 채로 스키마가 어긋난 DB 를 만나면 마이그레이션을 조용히 건너뛰어 더 위험하다.
    baseline-on-migrate: false

# Swagger UI · OpenAPI 문서 차단. 엔드포인트 목록은 공격 표면이다.
# (SecurityConfig 가 이 값을 보고 permitAll 등록 자체를 건너뛴다)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  # 콘솔(docker logs)과 함께 파일에도 남긴다. 컨테이너는 배포마다 새로 만들어져 docker logs 가 사라지므로,
  # 파일은 compose 의 tuk-app-logs 볼륨에 둬서 배포 뒤에도 남게 한다. 날짜별로 나눠 압축, 30일 · 300MB 까지.
  file:
    name: /app/logs/tuk.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 300MB
  level:
    root: info
    com.tuk: info
    # 개발용 바인딩 파라미터 로그(개인정보 포함 가능) 끄기
    org.hibernate.orm.jdbc.bind: warn
    org.hibernate.SQL: warn
