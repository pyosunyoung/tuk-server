spring:
  application:
    name: bungae-server

  # 비밀값/환경별 오버라이드는 application-local.yml(gitignore)에. 없으면 무시된다.
  # 우선순위: 환경변수 > application-local.yml > 아래 기본값
  config:
    import: optional:file:./application-local.yml

  # 로컬 PostgreSQL. 운영/실제 값은 환경변수(DB_*)로 주입 — 커밋 파일엔 로컬 기본값만.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bungae}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 로컬 개발 편의상 update. 스키마 확정 후 validate + 마이그레이션(Flyway)으로 전환 권장.
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # LAZY 연관관계 N+1 완화 (컨벤션상 모든 연관관계 LAZY)
        default_batch_fetch_size: 100

  # 로컬 Redis (presence TTL / 세션 레지스트리 / refresh 토큰 / 추후 Pub/Sub)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# FCM 푸시. 기본은 꺼짐(로깅 구현체 사용) → Firebase 키 없이도 앱이 뜬다.
# 실제 발송하려면 FCM_ENABLED=true + 서비스 계정 JSON 경로(FCM_CREDENTIALS_PATH) 지정.
fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

# 자체 JWT 설정. secret 은 배포 시 반드시 환경변수(JWT_SECRET)로 주입 — HS256 이라 최소 32바이트.
jwt:
  secret: ${JWT_SECRET:bungae-local-dev-secret-change-me-please-0123456789abcdef}
  access-token-validity: 30m
  refresh-token-validity: 14d

logging:
  level:
    # 바인딩 파라미터까지 보고 싶으면 TRACE
    org.hibernate.orm.jdbc.bind: trace
