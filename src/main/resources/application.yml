spring:
  application:
    name: tuk-server

  # 기본 활성 프로필 = dev (로컬은 IntelliJ/gradle 어느 쪽으로 켜도 dev 로그인이 동작).
  # 운영 배포 시 반드시 SPRING_PROFILES_ACTIVE=prod 등으로 덮을 것 — env 가 이 기본값보다 우선한다.
  # (dev 프로필은 DevSocialClient 를 활성화하므로 운영에서 켜지면 안 됨)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 비밀값/환경별 오버라이드는 application-local.yml(gitignore)에. 없으면 무시된다.
  # 우선순위: 환경변수 > application-local.yml > 아래 기본값
  config:
    import: optional:file:./application-local.yml

  # 로컬 PostgreSQL. 운영/실제 값은 환경변수(DB_*)로 주입 — 커밋 파일엔 로컬 기본값만.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tuk}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway 가 관리한다(src/main/resources/db/migration).
  # baseline-on-migrate: 이미 테이블이 있는 기존 개발 DB 는 V1 을 건너뛰고 그 이후만 적용.
  # (빈 DB 는 V1 부터 정상 적용된다)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # 스키마 변경은 마이그레이션으로만. 엔티티와 DB 가 어긋나면 기동 시점에 실패한다.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # LAZY 연관관계 N+1 완화 (컨벤션상 모든 연관관계 LAZY)
        default_batch_fetch_size: 100

  # 로컬 Redis (presence TTL / 세션 레지스트리 / refresh 토큰 / 추후 Pub/Sub)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# FCM 푸시. 기본은 꺼짐(로깅 구현체 사용) → Firebase 키 없이도 앱이 뜬다.
# 실제 발송하려면 FCM_ENABLED=true + 서비스 계정 JSON 경로(FCM_CREDENTIALS_PATH) 지정.
fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

# 카카오 사용자 정보 API base URL. 앱이 넘긴 access token 을 여기에 검증한다(백엔드는 별도 키 불필요).
kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}

# 자체 JWT 설정. secret 은 배포 시 반드시 환경변수(JWT_SECRET)로 주입 — HS256 이라 최소 32바이트.
jwt:
  secret: ${JWT_SECRET:tuk-local-dev-secret-change-me-please-0123456789abcdef}
  access-token-validity: 30m
  refresh-token-validity: 14d

# 헬스체크만 노출한다. env·beans·heapdump 같은 나머지 actuator 엔드포인트는 공격 표면이라 닫아둔다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 운영에서 DB·Redis 상세 상태를 익명에게 흘리지 않는다(살았는지 여부만).
      show-details: never
      probes:
        enabled: true

# CORS 허용 오리진. 앱(Flutter 네이티브)은 CORS 대상이 아니고, 웹(Next.js)만 해당한다.
# 운영은 CORS_ALLOWED_ORIGINS 로 실제 도메인을 주입할 것 (쉼표 구분).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    # 바인딩 파라미터까지 보고 싶으면 TRACE
    org.hibernate.orm.jdbc.bind: trace
